name: Deploy Production

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+" # stable
      - "v[0-9]+.[0-9]+.[0-9]+-rc\\.[0-9]+" # release candidate (e.g. v1.2.0-rc1)

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  test:
    permissions:
      contents: read
      pull-requests: read
      checks: write
    uses: ./.github/workflows/test.yaml

  deploy:
    needs: test
    uses: ./.github/workflows/deploy.yaml
    permissions:
      contents: write
      id-token: write
      packages: write
      attestations: write
    with:
      environment: production
      version: ${{ github.ref_name }}
    secrets:
      segment_write_key_opensource: ${{ secrets.SEGMENT_WRITE_KEY_OPENSOURCE }}

  docs:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Download OpenAPI specification artifacts
        uses: actions/download-artifact@v7
        with:
          name: marble-api-openapi
          path: /tmp/openapis

      - name: Publish Marble API OpenAPI
        uses: readmeio/rdme@v10
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
          README_API_KEY: ${{ secrets.README_API_KEY }}
        with:
          rdme: openapi upload --version=v1.0.0 --slug=marble-api /tmp/openapis/marble-api-v1.yml

      - name: Publish Marble API OpenAPI beta endpoints
        uses: readmeio/rdme@v10
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
          README_API_KEY: ${{ secrets.README_API_KEY }}
        with:
          rdme: openapi upload --version=v1.0.0 --slug=marble-api-beta /tmp/openapis/marble-api-v1beta.yml
