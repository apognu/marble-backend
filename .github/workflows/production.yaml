name: Deploy Production

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+" # stable
      - "v[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+" # release candidate (e.g. v1.2.0-rc.1)
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to create and release (e.g. v1.2.0 or v1.2.0-rc.1)"
        type: string
        required: true

# On tag push, `inputs.tag` is empty and the pushed tag is used. On manual runs, the tag is
# created on the current commit by the release job.
concurrency:
  group: ${{ github.workflow }}-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Check tag format
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]]; then
            echo "::error::Invalid tag '$TAG', expected vX.Y.Z or vX.Y.Z-rc.N"
            exit 1
          fi

      - name: Check tag does not exist
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${{ github.repository }}/git/ref/tags/$TAG" > /dev/null 2>&1; then
            echo "::error::Tag '$TAG' already exists, push it instead of running this workflow manually"
            exit 1
          fi

  test:
    needs: validate
    permissions:
      contents: read
      pull-requests: read
      checks: write
    uses: ./.github/workflows/test.yaml

  image:
    needs: validate
    permissions:
      contents: read
    uses: ./.github/workflows/image.yaml
    with:
      version: ${{ inputs.tag || github.ref_name }}
    secrets:
      segment_write_key_opensource: ${{ secrets.SEGMENT_WRITE_KEY_OPENSOURCE }}

  deploy:
    needs: [test, image]
    uses: ./.github/workflows/deploy.yaml
    permissions:
      contents: read
      packages: write
      id-token: write
    with:
      environment: production
      version: ${{ inputs.tag || github.ref_name }}

  release:
    needs: deploy
    uses: ./.github/workflows/release.yaml
    permissions:
      contents: write
    with:
      tag: ${{ inputs.tag || github.ref_name }}

  docs:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Download OpenAPI specification artifacts
        uses: actions/download-artifact@v7
        with:
          name: marble-api-openapi
          path: /tmp/openapis

