name: Deploy back-end

on:
  workflow_call:
    inputs:
      environment:
        type: string
        description: "Github environment to use"
        required: true
      version:
        type: string
        description: "version to deploy"
        required: true
    secrets:
      segment_write_key_opensource:
        description: write key for segment (open source deployment)

permissions:
  contents: write
  id-token: write
  packages: write
  attestations: write

jobs:
  docker:
    name: Build container image
    runs-on: ubuntu-latest
    env:
      # COMMIT_IMAGE: ghcr.io/checkmarble/marble-backend:${{ github.sha }}
      COMMIT_IMAGE: ghcr.io/apognu/marble-backend:${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract version from tag
        id: version
        run: echo "MARBLE_VERSION=$(git describe --tags)" >> "$GITHUB_OUTPUT"

      - name: Authenticate to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache
        uses: actions/cache@v6
        id: cache
        with:
          path: docker-cache
          key: marble-${{ github.job }}-${{ hashFiles('Dockerfile') }}
          restore-keys: |
            marble-${{ github.job }}
            marble-

      - name: Restore Docker cache mounts
        uses: reproducible-containers/buildkit-cache-dance@v3
        with:
          builder: ${{ steps.setup-buildx.outputs.name }}
          cache-dir: docker-cache
          dockerfile: Dockerfile
          skip-extraction: ${{ steps.cache.outputs.cache-hit }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          push: true
          build-args: |
            MARBLE_VERSION=${{ steps.version.outputs.MARBLE_VERSION }}
            SEGMENT_WRITE_KEY=${{ secrets.segment_write_key_opensource }}
          tags: ${{ env.COMMIT_IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: [docker]
    name: Deploy
    environment: ${{ inputs.environment }}
    runs-on: ubuntu-latest
    env:
      COMMIT_IMAGE: ghcr.io/checkmarble/marble-backend:${{ github.sha }}
      VERSION_IMAGE: europe-west1-docker.pkg.dev/marble-infra/marble/marble-backend:${{ inputs.version }}
    steps:
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

      - name: Authentication to GCP
        id: auth
        uses: google-github-actions/auth@v3
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
        with:
          token_format: access_token
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.WORKLOAD_IDENTITY_PROVIDER_ID }}
          service_account: ${{ vars.SERVICE_ACCOUNT_EMAIL }}

      - name: Login to Google Artifact Registry
        uses: docker/login-action@v4
        with:
          registry: europe-west1-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Tag image with release version
        run: |
          echo "Tagging $COMMIT_IMAGE as $VERSION_IMAGE"
          docker buildx imagetools create --tag "$VERSION_IMAGE" "$COMMIT_IMAGE"

      - name: Deploy migration job
        run: |
          gcloud run jobs deploy migrations \
            --quiet \
            --region="europe-west1" \
            --execute-now \
            --wait \
            --container=migrations \
            --image="$VERSION_IMAGE"

      - name: Deploy server
        run: |
          gcloud run deploy marble-backend \
            --quiet \
            --image="$VERSION_IMAGE" \
            --region="europe-west1"

      - name: Deploy analytics server
        run: |
          gcloud run deploy marble-analytics-backend \
            --quiet \
            --image="$VERSION_IMAGE" \
            --region="europe-west1"

      - name: Deploy execute async worker service
        run: |
          gcloud run deploy marble-backend-worker \
            --quiet \
            --image="$VERSION_IMAGE" \
            --region="europe-west1"
