name: Deploy back-end

on:
  workflow_call:
    inputs:
      environment:
        type: string
        description: "Github environment to use"
        required: true
      version:
        type: string
        description: "version to deploy"
        required: true

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy
    environment: ${{ inputs.environment }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # needed for using open id token to authenticate with GCP services, and for attestations
      attestations: write
    env:
      IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/marble-backend
      COMMIT_IMAGE: ghcr.io/${{ github.repository_owner }}/marble-backend:${{ github.sha }}
      VERSION_IMAGE: europe-west1-docker.pkg.dev/marble-infra/marble/marble-backend:${{ inputs.version }}
    steps:
      - name: Download image
        uses: actions/download-artifact@v7
        with:
          name: marble-image
          path: ${{ runner.temp }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        id: push
        run: |
          skopeo copy --digestfile "$RUNNER_TEMP/image.digest" "oci-archive:$RUNNER_TEMP/image.tar" "docker://$COMMIT_IMAGE"
          echo "digest=$(cat "$RUNNER_TEMP/image.digest")" >> "$GITHUB_OUTPUT"

      - name: Attest image
        uses: actions/attest-build-provenance@v3
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

