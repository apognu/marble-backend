name: Deploy back-end

on:
  workflow_call:
    inputs:
      environment:
        type: string
        description: "Github environment to use"
        required: true
      version:
        type: string
        description: "version to deploy"
        required: true

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy
    environment: ${{ inputs.environment }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # needed for using open id token to authenticate with GCP services
    env:
      COMMIT_IMAGE: ghcr.io/${{ github.repository_owner }}/marble-backend:${{ github.sha }}
      VERSION_IMAGE: europe-west1-docker.pkg.dev/marble-infra/marble/marble-backend:${{ inputs.version }}
    steps:
      - name: Download image
        uses: actions/download-artifact@v7
        with:
          name: marble-image
          path: ${{ runner.temp }}

      - name: Push image
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: |
          echo "$GITHUB_TOKEN" | skopeo login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          skopeo copy "oci-archive:$RUNNER_TEMP/image.tar" "docker://$COMMIT_IMAGE"

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

