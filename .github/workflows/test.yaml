name: Test back-end

on: workflow_call

permissions:
  contents: read
  pull-requests: read
  checks: write

jobs:
  test:
    name: Test back-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        id: go
        uses: ./.github/actions/setup-go
        with:
          cache-prefix: go-host

      - name: Test
        run: go test ./...

      - name: Generate Marble API OpenAPI as temporary file
        run: |
          go run pubapi/openapi/generate.go v1 > /tmp/marble-api-v1.yml
          cp pubapi/openapi/v1beta.yml /tmp/marble-api-v1beta.yml

      - name: Upload OpenAPI specifications as artifacts, to be downloaded and used in the production deployment workflow
        uses: actions/upload-artifact@v7
        with:
          name: marble-api-openapi
          path: /tmp/marble-api-*.yml
          retention-days: 1

      # The test job compiles every package and test binary, so it is the one priming the host cache for PRs.
      - name: Save Go cache
        if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ steps.go.outputs.cache-key }}

  lint:
    name: Lint back-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: ./.github/actions/setup-go
        with:
          cache-prefix: go-host

      - name: Check go.mod is tidy
        run: go mod tidy -diff

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
        with:
          version: v2.11
          args: --timeout=5m -v
